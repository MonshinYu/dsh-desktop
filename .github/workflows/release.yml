name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: '手动触发时的版本递增类型'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version & push tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Bump version
        id: bump
        run: |
          set -euo pipefail

          BUMP="${{ inputs.version_bump || 'patch' }}"

          NEW=$(bun scripts/bump_version.mjs "$BUMP" | tail -1)

          echo "New version: $NEW"

          git add -A
          git commit -m "chore(release): v${NEW} [skip ci]"
          git tag "v$NEW"

          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"

      - name: Push version bump to main
        run: |
          git push origin HEAD:main || {
            sleep 3
            git pull --rebase origin main
            git push origin HEAD:main
          }

      - name: Push tag
        run: |
          git push origin "refs/tags/${{ steps.bump.outputs.tag }}"


  build:
    name: Build ${{ matrix.label }}
    needs: bump
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage

          - label: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg

          - label: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg

          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build runtime (${{ matrix.target }})
        run: |
          bun run clone:runtime:lib
          bun run build:runtime -- ${{ matrix.target }}

      - name: Build Tauri app
        shell: bash
        run: |
          bun tauri build \
            --target ${{ matrix.target }} \
            --bundles ${{ matrix.bundles }}

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          RELEASE_DIR="release"

          mkdir -p "$RELEASE_DIR"

          case "${{ matrix.label }}" in
            linux-x64)
              # Linux: copy .deb and .AppImage with renamed filenames
              for f in "$BUNDLE_DIR"/deb/*.deb; do
                [ -f "$f" ] && cp "$f" "$RELEASE_DIR/dsh-linux-x64.deb"
              done
              for f in "$BUNDLE_DIR"/appimage/*.AppImage; do
                [ -f "$f" ] && cp "$f" "$RELEASE_DIR/dsh-linux-x64.AppImage"
              done
              ;;
            macos-x64)
              # macOS x64: copy .dmg
              for f in "$BUNDLE_DIR"/dmg/*.dmg; do
                [ -f "$f" ] && cp "$f" "$RELEASE_DIR/dsh-macos-x64.dmg"
              done
              ;;
            macos-arm64)
              # macOS ARM64: copy .dmg
              for f in "$BUNDLE_DIR"/dmg/*.dmg; do
                [ -f "$f" ] && cp "$f" "$RELEASE_DIR/dsh-macos-arm64.dmg"
              done
              ;;
            windows-x64)
              # Windows: only copy NSIS .exe installer, skip .nsis.zip
              for f in "$BUNDLE_DIR"/nsis/*.exe; do
                [ -f "$f" ] && cp "$f" "$RELEASE_DIR/dsh-windows-x64.exe"
              done
              ;;
          esac

          echo "========================================"
          echo "Release artifacts prepared:"
          echo "========================================"
          ls -la "$RELEASE_DIR/"
          echo "========================================"

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-${{ matrix.label }}
          path: release/


  release:
    name: Create GitHub Release
    needs: [bump, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: dsh-*
          merge-multiple: true

      - name: Verify release assets
        run: |
          set -euo pipefail

          COUNT=$(find release-assets -type f | wc -l)

          echo "Found $COUNT release asset(s)"

          echo "========================================"
          echo "Release assets:"
          echo "========================================"
          find release-assets -type f -print
          echo "========================================"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No release assets found!"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.bump.outputs.tag }}"
          VERSION="${{ needs.bump.outputs.version }}"

          echo "Creating GitHub Release: $TAG"

          gh release create "$TAG" \
            --title "v$VERSION" \
            --generate-notes

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${{ needs.bump.outputs.tag }}"

          echo "Uploading release assets for $TAG..."

          # Upload each artifact explicitly (files are already filtered in build job)
          for artifact in release-assets/*; do
            if [ -f "$artifact" ]; then
              echo "Uploading: $artifact"
              gh release upload "$TAG" "$artifact" --clobber
            fi
          done

          echo ""
          echo "========================================"
          echo "Assets uploaded to release $TAG:"
          echo "========================================"
          gh release view "$TAG" --json assets --jq '.assets[].name'

          echo "========================================"
          echo "Release assets uploaded successfully."
